name: DreamSpend
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 1.0
configs:
  Debug: debug
  Release: release
targets:
  DreamSpend:
    type: application
    platform: iOS
    sources:
      - path: DreamSpend/App
      - path: DreamSpend/Core
      - path: DreamSpend/Features
      - path: DreamSpend/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teccod.DreamSpend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconCoin AppIconGame
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BDLXDVBT8B
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: 18.6
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        VERSIONING_SYSTEM: apple-generic
  DreamSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DreamSpend/Tests
    dependencies:
      - target: DreamSpend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.teccod.DreamSpendTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DreamSpend.app/DreamSpend"
        DEVELOPMENT_TEAM: BDLXDVBT8B
        IPHONEOS_DEPLOYMENT_TARGET: 18.6
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  DreamSpend:
    build:
      targets:
        DreamSpend: all
        DreamSpendTests: [test]
    test:
      targets:
        - name: DreamSpendTests
      gatherCoverageData: true
